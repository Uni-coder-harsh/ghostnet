server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
      file-size-threshold: 2MB
  datasource:
    url: jdbc:sqlite:data/ghostnet_test.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: GhostNetTestHikariPool
      maximum-pool-size: 5
      connection-test-query: SELECT 1

ghostnet:
  name: "GhostNet-Test"
  version: "1.0.0"
  database:
    path: data/ghostnet_test.db
    wal-mode: true
    busy-timeout-ms: 5000
  storage:
    base-path: data/test-storage
    max-file-size-mb: 100
    user-vault-quota-mb: 1024
    guest-temp-quota-mb: 256
    guest-expiration-hours: 24
  security:
    cookie-name: "GHOSTNET_SESSION"
    session-duration-hours: 72
    rate-limit-per-minute: 500
    max-message-length: 8192
  retention:
    enabled: true
    message-retention-days: 30
  network:
    heartbeat-interval-seconds: 15
    client-timeout-seconds: 45

logging:
  level:
    root: WARN
    com.ghostnet: INFO
